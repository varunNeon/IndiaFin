name: Keep Streamlit Alive

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - ".github/workflows/keep_alive.yml"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping IndiaFin
        run: |
          curl --location --max-time 60 \
            -o /dev/null -w "HTTP %{http_code}\n" \
            "https://indiafin-mf9orp8gbadok3wzmxppj7.streamlit.app/" || true