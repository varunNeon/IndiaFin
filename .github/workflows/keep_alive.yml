name: Keep Streamlit Alive

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - ".github/workflows/keep_alive.yml"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: curl --silent --show-error --max-time 30 https://indiafin-mf9orp8gbadok3wzmxppj7.streamlit.app > /dev/null
